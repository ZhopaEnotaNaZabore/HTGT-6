buildscript {
    /* Репозитории Gradle-плагинов */
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        dependencies {
            classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.1') {
                changing = true
            }
        }

    }
}


apply plugin: 'forge'
apply plugin: 'idea'

targetCompatibility = sourceCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = project.hasProperty("artifactSuffix")
        ? "HiTech6_V_1.0.4_Build_" + project.property("artifactSuffix")
        : "HiTech6_V_1.0.4_Build_"

/* Вспомогательные конфиги для IDEA */
idea {
    module {
        inheritOutputDirs = true // Складываем *.class и assets в одну директорию, из разных Forge читать не будет
        excludeDirs += file('./run') // Исключаем директории из индексации
    }
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10' // Версия Forge

}

// The copied final pack contains production/SRG mods. It must be launched with
// the obfuscated Minecraft jar, not ForgeGradle's MCP/deobfuscated runtime.
def packClientRoot = file('Modpack/HTGT6_104')
def packClientLibraries = fileTree(dir: new File(packClientRoot, 'libraries'),
        include: '**/*.jar', exclude: 'com/mojang/authlib/**')
def packClientAuthlib = fileTree(
        dir: new File(gradle.gradleUserHomeDir,
                'caches/modules-2/files-2.1/com.mojang/authlib/1.5.16'),
        include: '**/authlib-1.5.16.jar')
def packClientNatives = new File(gradle.gradleUserHomeDir,
        'caches/minecraft/net/minecraft/minecraft_natives/1.7.10')
def packClientAssets = new File(gradle.gradleUserHomeDir, 'caches/minecraft/assets')
def packClientForgeJar = new File(packClientRoot,
        'libraries/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/'
                + 'forge-1.7.10-10.13.4.1614-1.7.10.jar')

def configurePackClient = { clientTask ->
    // This launcher uses an obfuscated production Minecraft jar, therefore it
    // must never replace the reobfuscated mod artifact with the plain jar just
    // before launch.
    clientTask.dependsOn tasks.reobf
    clientTask.workingDir file('run')
    clientTask.main = 'net.minecraft.launchwrapper.Launch'
    clientTask.classpath = files(
            new File(packClientRoot, 'minecraft.jar'),
            tasks.jar.archivePath,
            packClientAuthlib,
            packClientLibraries,
            fileTree(dir: 'libs', include: '*.jar'))
    clientTask.setJvmArgs([
            '-Xmx4G',
            '-Dlog4j2.disableJmx=true',
            "-Dlog4j.configurationFile=jar:${packClientForgeJar.toURI().toASCIIString()}!/log4j2.xml",
            "-Djava.library.path=${packClientNatives.absolutePath}"
    ])
    clientTask.setArgs([
            '--username', 'HiTech6Dev',
            '--version', '1.7.10',
            '--gameDir', '.',
            '--assetsDir', packClientAssets.absolutePath,
            '--assetIndex', '1.7.10',
            '--accessToken', '0',
            '--userProperties', '{}',
            '--tweakClass', 'cpw.mods.fml.common.launcher.FMLTweaker'
    ])
    clientTask.doFirst {
        if (!new File(packClientRoot, 'minecraft.jar').isFile()) {
            throw new GradleException('ModPack runtime is missing Modpack/HTGT6_104/minecraft.jar')
        }
        if (packClientAuthlib.files.size() != 1) {
            throw new GradleException('Expected one vanilla authlib 1.5.16 in the local Gradle cache')
        }
        if (!packClientNatives.isDirectory() || !packClientAssets.isDirectory()) {
            throw new GradleException('Run setupDecompWorkspace before runClient')
        }
        if (!packClientForgeJar.isFile()) {
            throw new GradleException('ModPack Forge runtime/log4j2 configuration is missing')
        }
    }
}

// Diagnostic launcher for comparing against the assembled production pack.
// The normal runClient task is intentionally left under ForgeGradle control.
task runPackClient(type: JavaExec)
configurePackClient(tasks.runPackClient)

// ResourceLoader 1.3 detects the ForgeGradle deobfuscated environment and
// reads the matching SRG -> MCP tables from ../mcp relative to run/. Keep the
// files generated from ForgeGradle's own 1.7.10 workspace cache so runClient
// remains a normal GradleStart launch with the same mappings as forgeSrc.
def forgeGradleMcpConf = new File(gradle.gradleUserHomeDir,
        'caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/unpacked/conf')
task syncRunMcpMappings(type: Copy) {
    from forgeGradleMcpConf
    into file('mcp')
    include 'fields.csv', 'methods.csv'
    doFirst {
        if (!new File(forgeGradleMcpConf, 'fields.csv').isFile()
                || !new File(forgeGradleMcpConf, 'methods.csv').isFile()) {
            throw new GradleException('ForgeGradle MCP mappings are missing; run setupDecompWorkspace first')
        }
    }
}
tasks.runClient.dependsOn syncRunMcpMappings
def forgeGradleSrgsDir = new File(gradle.gradleUserHomeDir,
        'caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/srgs')
def runClientSrgToMcp = new File(forgeGradleSrgsDir, 'srg-mcp.srg')
tasks.runClient.jvmArgs "-Dhtgt6.devMcpMappings=${runClientSrgToMcp.absolutePath}"
tasks.runClient.jvmArgs '-Dmixin.env.remapRefMap=true'
tasks.runClient.jvmArgs "-Dmixin.env.refMapRemappingFile=${runClientSrgToMcp.absolutePath}"
// HTGT6 intentionally keeps its ASM and runtime hooks in one transformer.
// Disable eager JVM verification in the development launcher so Minecraft
// parameter types are not resolved before the pack's EARLY mixins are ready.
tasks.runClient.jvmArgs '-noverify'
// Preserve Unicode startup artwork in Log4j output on Windows DEV runs.
tasks.runClient.jvmArgs '-Dfile.encoding=UTF-8'
tasks.runServer.jvmArgs '-Dfile.encoding=UTF-8'
// The complete pack needs substantially more headroom than ForgeGradle's
// default heap during mod discovery, texture stitching and world loading.
tasks.runClient.minHeapSize = '2G'
tasks.runClient.maxHeapSize = '8G'

// ForgeGradle 1.2 places flatDir compile-only libraries on GradleStart's Java
// classpath. Release/SRG libraries loaded there bypass LaunchClassLoader, so
// remap only those copies into build/ and substitute them on runClient's
// classpath. Source jars in libs and all jars in run/mods remain untouched.
def runClientReleaseLibraries = files(
        'libs/CodeChickenCore-1.4.7.jar',
        'libs/CraftTweaker-3.jar',
        'libs/GalaxySpace-1.7.10-1.2.15.jar',
        'libs/gregtech_1.7.10-6.15.08-HiTech6_Edition.jar',
        'libs/gtnhlib-0.7.0.jar',
        'libs/modularui-2.0.8-1.7.10.jar',
        'libs/NotEnoughItems-2.8.19-GTNH.jar')
def forgeSrcJar = new File(gradle.gradleUserHomeDir,
        'caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/'
                + 'forgeSrc-1.7.10-10.13.4.1614-1.7.10.jar')

// A running Windows client holds these jars open. Never delete its library
// directory: changed inputs get a new cache directory, unchanged outputs are
// reused even when Gradle's task history was invalidated by build.gradle edits.
def sha256File = { File sourceFile ->
    if (!sourceFile.isFile()) return 'missing'
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    sourceFile.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString()
}
def remapCacheVersion = 'srg-mcp-filtered-v1'
def remapCacheInputs = runClientReleaseLibraries.files.sort { it.name } + [runClientSrgToMcp, forgeSrcJar]
def remapCacheKey = java.security.MessageDigest.getInstance('SHA-256')
        .digest((remapCacheVersion + '\n' + remapCacheInputs.collect {
            it.name + ':' + sha256File(it)
        }.join('\n')).getBytes('UTF-8')).encodeHex().toString()
def runClientDeobfLibrariesDir = file("${buildDir}/runClient/remapped/${remapCacheKey}")

task deobfuscateRunClientLibraries {
    dependsOn genSrgs
    inputs.files runClientReleaseLibraries
    inputs.file runClientSrgToMcp
    inputs.file forgeSrcJar
    inputs.property 'remapCacheVersion', remapCacheVersion
    // This is a shared runtime cache, not a disposable task output. Gradle
    // otherwise removes it as stale when IDEA and CLI use different histories.
    // The checksum check below replaces Gradle's output-directory tracking.
    doLast {
        runClientDeobfLibrariesDir.parentFile.mkdirs()
        def cacheLockFile = new RandomAccessFile(new File(runClientDeobfLibrariesDir.parentFile,
                remapCacheKey + '.lock'), 'rw')
        def cacheLock = cacheLockFile.channel.lock()
        try {
        runClientDeobfLibrariesDir.mkdirs()
        def checksumFile = new File(runClientDeobfLibrariesDir, 'checksums.properties')
        def checksums = new Properties()
        if (checksumFile.isFile()) checksumFile.withInputStream { checksums.load(it) }
        def pending = runClientReleaseLibraries.files.sort { it.name }.findAll { inputFile ->
            def outputFile = new File(runClientDeobfLibrariesDir, inputFile.name)
            !outputFile.isFile() || checksums.getProperty(inputFile.name) != sha256File(outputFile)
        }
        if (pending.isEmpty()) {
            logger.lifecycle('Reusing verified runClient libraries (no files replaced)')
            return
        }
        def minecraftJar = net.md_5.specialsource.Jar.init(forgeSrcJar)
        pending.each { inputFile ->
            def mapping = new net.md_5.specialsource.JarMapping()
            mapping.loadMappings(runClientSrgToMcp)
            def inputJar = net.md_5.specialsource.Jar.init(inputFile)
            def inheritance = new net.md_5.specialsource.provider.JointProvider()
            inheritance.add(new net.md_5.specialsource.provider.JarProvider(inputJar))
            inheritance.add(new net.md_5.specialsource.provider.JarProvider(minecraftJar))
            mapping.setFallbackInheritanceProvider(inheritance)
            def remapper = new net.md_5.specialsource.JarRemapper(null, mapping, null)
            remapper.setCopyEmptyDirectories(false)
            def outputFile = new File(runClientDeobfLibrariesDir, inputFile.name)
            def remappedFile = new File(runClientDeobfLibrariesDir, inputFile.name + '.remapped')
            def packedFile = new File(runClientDeobfLibrariesDir, inputFile.name + '.packed')
            remapper.remapJar(inputJar, remappedFile)

            // Forge 1.7.10's ASM 5 attempts to inspect every class in a mod jar
            // and cannot parse modern multi-release (Java 9+) class files.
            // Remapping invalidates jar signatures as well, so omit both from
            // these generated development-only copies.
            ant.zip(destfile: packedFile) {
                zipfileset(src: remappedFile,
                        excludes: 'META-INF/versions/**,META-INF/*.SF,META-INF/*.RSA,META-INF/*.DSA')
            }
            java.nio.file.Files.move(packedFile.toPath(), outputFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            checksums.setProperty(inputFile.name, sha256File(outputFile))
            checksumFile.withOutputStream { checksums.store(it, remapCacheVersion) }
            project.delete remappedFile
        }
        } finally {
            cacheLock.release()
            cacheLockFile.close()
        }
    }
}
tasks.runClient.dependsOn deobfuscateRunClientLibraries

// Coremods that also contain runtime hooks must be defined by
// LaunchClassLoader. ForgeGradle normally puts the project jar on the Java
// application classpath, which makes its ASM classes resolve Minecraft types
// before early mixins (notably Angelica) are ready. Keep the standard
// GradleStart launch, but expose the current build as an ordinary mod jar.
def runClientCurrentMod = file('run/mods/HTGT6-current-dev.jar')
task syncCurrentModForRunClient(type: Copy) {
    dependsOn jar
    from tasks.jar.archivePath
    into runClientCurrentMod.parentFile
    rename { runClientCurrentMod.name }
}
tasks.runClient.dependsOn syncCurrentModForRunClient

afterEvaluate {
    // ForgeGradle appends flatDir dependencies late, so filter only after the
    // standard runClient classpath has been fully configured.
    def releaseLibraryPaths = runClientReleaseLibraries.files.collect {
        it.canonicalFile
    } as Set
    def standardRunClientClasspath = tasks.runClient.classpath
    tasks.runClient.classpath = standardRunClientClasspath
            .filter {
                (!releaseLibraryPaths.contains(it.canonicalFile)) &&
                        (it.canonicalFile != tasks.jar.archivePath.canonicalFile)
            }
            .plus(fileTree(dir: runClientDeobfLibrariesDir, include: '*.jar'))
}


tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    from(rootDir) {
        include 'LICENSE', 'THIRD_PARTY_NOTICES.md'
        into 'META-INF/htgt6'
    }
    from('src/api/java/uristqwerty/LICENSE.txt') {
        into 'META-INF/htgt6/licenses'
        rename { 'Uristqwerty-MIT.txt' }
    }
}

/* Dev версия мода без обфускации MC */
// Official audio exists only in the verified external cache, including IDE runs.
def officialSoundManifest = file('src/main/resources/htgt6-external-sounds.json')
def officialSoundData = new groovy.json.JsonSlurper().parse(officialSoundManifest)
def officialSoundEntries = officialSoundData.entries
def lodestoneSoundImports116 = officialSoundData.officialIndex116
def officialSoundPaths = officialSoundEntries.collect { it.resource as String }.toSet()
if (lodestoneSoundImports116 != null) officialSoundPaths.addAll(lodestoneSoundImports116.entries.collect { it.resource as String })
def excludeOfficialSound = { details -> officialSoundPaths.contains(details.path) ||
        details.path.startsWith('assets/htgt6/sounds/') && details.path.endsWith('.ogg') }
task verifyExternalSoundManifest {
    inputs.file officialSoundManifest
    inputs.files fileTree('src/main/resources/assets/htgt6/sounds') { include '**/*.ogg' }
    doLast {
        if (!fileTree('src/main/resources/assets/htgt6/sounds') { include '**/*.ogg' }.isEmpty())
            throw new GradleException('Backport sounds must use the external cloud manifest, never bundled OGG files')
        def seen = new HashSet()
        def pinnedSizes = [:]
        officialSoundEntries.each { entry ->
            if (!(entry.resource ==~ /assets\/[a-z0-9_]+\/sounds\/[a-zA-Z0-9_.\/-]+\.ogg/) ||
                    entry.resource.contains('..') || entry.resource.contains('//') ||
                    !(entry.sha1 ==~ /[0-9a-f]{40}/) || (entry.size as long) <= 0 ||
                    (entry.size as long) > 32L * 1024 * 1024 || !seen.add(entry.resource))
                throw new GradleException('Invalid external sound manifest entry: ' + entry.resource)
            if (pinnedSizes.containsKey(entry.sha1) && pinnedSizes[entry.sha1] != entry.size)
                throw new GradleException('Conflicting external sound sizes: ' + entry.sha1)
            pinnedSizes[entry.sha1] = entry.size
            def source = file('src/main/resources/' + entry.resource)
            if (source.exists()) throw new GradleException('External sound accidentally rebundled in source: ' + entry.resource)
        }
        if (lodestoneSoundImports116 != null) {
            def spec = lodestoneSoundImports116
            if (spec.id != '8' || spec.sha1 != '117379a04a44c80fc5a5806f2e676ca4ac81f5ce' ||
                    (spec.size as long) != 416952L || spec.url != 'https://piston-meta.mojang.com/v1/packages/117379a04a44c80fc5a5806f2e676ca4ac81f5ce/8.json')
                throw new GradleException('Untrusted lodestone sound index')
            if (spec.entries.size() > 64) throw new GradleException('Too many lodestone sound imports')
            spec.entries.each { entry ->
                if (!(entry.resource ==~ /assets\/htgt6\/sounds\/[a-zA-Z0-9_.\/-]+\.ogg/) ||
                        entry.resource.contains('..') || entry.resource.contains('//') || !seen.add(entry.resource) ||
                        entry.officialResource != 'minecraft/' + entry.resource.substring('assets/htgt6/'.length()))
                    throw new GradleException('Invalid lodestone sound import: ' + entry.resource)
                if (file('src/main/resources/' + entry.resource).exists())
                    throw new GradleException('Imported sound accidentally rebundled: ' + entry.resource)
            }
        }
    }
}
jar {
    dependsOn verifyExternalSoundManifest
    exclude excludeOfficialSound
    // Do not ship stale 0.2 allowlists left in incremental build output.
    exclude 'META-INF/htgt6-watcher*.properties'
    exclude 'com/mod/htgt6/watcher/WatcherTransformers.class'
}
task devJar(type: Jar) {
    dependsOn verifyExternalSoundManifest
    exclude excludeOfficialSound
    exclude 'META-INF/htgt6-watcher*.properties'
    exclude 'com/mod/htgt6/watcher/WatcherTransformers.class'
    classifier = 'dev'
    manifest = jar.manifest
    from sourceSets.main.output
}

// runClient/IDE's jar task produces MCP bytecode and can replace build/libs.
// Keep the distributable in a separate directory, after SRG reobfuscation.
task releaseMod(type: Copy) {
    group = 'build'
    description = 'Build and verify the production mod for Forge/Crucible clients and servers.'
    dependsOn reobf
    from { tasks.jar.archivePath }
    into file("${buildDir}/release")
    doFirst {
        def zip = new java.util.zip.ZipFile(tasks.jar.archivePath)
        try {
            def entry = zip.getEntry('com/mod/htgt6/asm/HTGT6Transformer.class')
            if (entry == null) throw new GradleException('Release is missing HTGT6Transformer')
            def node = new org.objectweb.asm.tree.ClassNode()
            zip.getInputStream(entry).withCloseable { stream ->
                new org.objectweb.asm.ClassReader(stream).accept(node, 0)
            }
            int registryCalls = 0
            node.methods.each { method ->
                method.instructions.toArray().each { instruction ->
                    if (instruction instanceof org.objectweb.asm.tree.MethodInsnNode
                            && instruction.owner == 'net/minecraft/world/biome/BiomeGenBase') {
                        if (instruction.name == 'getBiomeGenArray')
                            throw new GradleException('MCP/dev bytecode in release: BiomeGenBase.getBiomeGenArray. Run reobf before distributing.')
                        if (instruction.name == 'func_150565_n') registryCalls++
                    }
                    if (instruction instanceof org.objectweb.asm.tree.FieldInsnNode
                            && instruction.owner == 'net/minecraft/world/biome/BiomeGenBase'
                            && instruction.name in ['biomeID', 'ocean'])
                        throw new GradleException('MCP/dev biome field in release: ' + instruction.name)
                }
            }
            if (registryCalls < 4) throw new GradleException('Production biome registry hooks missing: ' + registryCalls)
            logger.lifecycle('Verified production biome hooks: {} SRG registry calls', registryCalls)
            def armorEntry = zip.getEntry('com/mod/htgt6/minecraft1202/Module/Gameplay/Combat/CombatDamage120.class')
            if (armorEntry == null) throw new GradleException('Release is missing CombatDamage120')
            def armorNode = new org.objectweb.asm.tree.ClassNode()
            zip.getInputStream(armorEntry).withCloseable { stream ->
                new org.objectweb.asm.ClassReader(stream).accept(armorNode, 0)
            }
            [')F', 'Z)F'].each { suffix ->
                def descriptor = '(Lnet/minecraft/entity/EntityLivingBase;[Lnet/minecraft/item/ItemStack;Lnet/minecraft/util/DamageSource;D' + suffix
                if (!armorNode.methods.any { method -> method.name == 'ApplyArmor' && method.desc == descriptor &&
                        (method.access & (org.objectweb.asm.Opcodes.ACC_PUBLIC | org.objectweb.asm.Opcodes.ACC_STATIC)) ==
                        (org.objectweb.asm.Opcodes.ACC_PUBLIC | org.objectweb.asm.Opcodes.ACC_STATIC) })
                    throw new GradleException('Stale/incompatible combat class in release: missing public static ApplyArmor' + descriptor)
            }
            logger.lifecycle('Verified Forge and hybrid-server ApplyArmor overloads in production JAR')
            if (java.util.Collections.list(zip.entries()).any { it.name.startsWith('assets/htgt6/sounds/') && it.name.endsWith('.ogg') })
                throw new GradleException('Backport audio must be downloaded from the cloud, not bundled in release')
        } finally { zip.close() }
    }
}

// Resource-only packaging check: no compilation or reobfuscation of parallel work.
task externalSoundPackagingFixture(type: Jar) {
    dependsOn verifyExternalSoundManifest
    destinationDir = file("${buildDir}/sounds178")
    archiveName = 'resource-selection-fixture.jar'
    from 'src/main/resources'
    include '**/*.ogg', '**/sounds.json', 'htgt6-external-sounds.json'
    exclude excludeOfficialSound
    doLast {
        def zip = new java.util.zip.ZipFile(archivePath)
        try {
            officialSoundPaths.each { path ->
                if (zip.getEntry(path) != null) throw new GradleException('Official audio still bundled: ' + path)
            }
            if (zip.getEntry('htgt6-external-sounds.json') == null ||
                zip.getEntry('assets/htgt6/sounds.json') == null)
                throw new GradleException('Required manifest/definitions omitted')
            if (java.util.Collections.list(zip.entries()).any { it.name.startsWith('assets/htgt6/sounds/') && it.name.endsWith('.ogg') })
                throw new GradleException('Bundled Backport audio found')
            def remaining = java.util.Collections.list(zip.entries()).count { it.name.endsWith('.ogg') }
            if (remaining != 11) throw new GradleException('Unexpected unrelated AmunRa sound count: ' + remaining)
            println "External sound packaging passed: ${officialSoundPaths.size()} cloud entries, zero Backport OGG files"
        } finally { zip.close() }
    }
}

