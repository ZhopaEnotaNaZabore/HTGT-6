artifacts {
    archives devJar
}

repositories {
    flatDir {dirs "libs"}
    mavenCentral()
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    //// CodeChickenLib is in the Forge maven
    maven {
        name = "chickenbones"
        url = "http://chickenbones.net/maven/"
    }
}
// ForgeGradle 1.2 otherwise selects Log4j 2.0-beta9 for runClient/runServer.
// Use the same external, Log4Shell-fixed runtime as the assembled pack.
// Do not shade logging classes into the mod or alter the user's Gradle cache.
configurations.all {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
}
def packLog4jRoot = 'Modpack/HTGT6_104/libraries/org/apache/logging/log4j'
dependencies {
    // makeStart compiles GradleStart against minecraftDeps, not compile.
    // compile/runtime inherit this configuration, so all launch paths share it.
    minecraftDeps files("${packLog4jRoot}/log4j-api/2.20.0/log4j-api-2.20.0.jar",
            "${packLog4jRoot}/log4j-core/2.20.0/log4j-core-2.20.0.jar",
            "${packLog4jRoot}/log4j-core/2.20.0/log4j-core-2.20.0-helpers-2.0-beta9.jar")

    compile 'io.netty:netty-all:4.0.10.Final'
    // Keep the exact HTGT6-edition artifact in the IDE/Gradle classpath.
    compileOnly files('libs/gregtech_1.7.10-6.15.08-HiTech6_Edition.jar')
    // GT6 connector/block base classes expose these optional API interfaces
    // in their class hierarchy. They are supplied by the assembled modpack.
    compileOnly files('Modpack/HTGT6_104/mods/appliedenergistics2-rv3-beta-6-client.jar')
    compileOnly name: 'GalaxySpace-1.7.10-1.2.15'
    compileOnly name: 'GalacticraftCore-1.7-3.0.12.504-dev'
    compileOnly name: 'Galacticraft-Planets-1.7-3.0.12.504-dev'
    compileOnly name: 'MicdoodleCore-1.7-3.0.12.504-dev'

    // Provided by the client/server modpack. Keep it external: this enables the
    // ModularUI 2 API without shading or decompiling the library into HiTech6.
    compileOnly name: 'modularui-2.0.8-1.7.10'
    //  compileOnly name: '+unimixins-all-1.7.10-0.1.23'
    compileOnly name: 'CraftTweaker-3'
    // Optional runtime integration: HTGT6 mirrors the final GT6 Crusher and
    // Shredder maps into EnderIO's SAG Mill after all mods finish loading.
    compileOnly files('run/mods/EnderIO-2.9.27.jar')
    // Optional runtime integration for the IE 0.7.7 multiblock Crusher.
    compileOnly files('run/mods/ImmersiveEngineering_mc1.7.10_0.7.7.jar')
    // Optional developer-agent integration. BetterQuesting remains supplied by
    // the modpack; HTGT6 only compiles against its public quest/edit API.
    compileOnly files('run/mods/BetterQuesting-3.7.15-GTNH.jar')
   // compileOnly name: 'NotEnoughItems-2.8.19-GTNH'



    //  compileOnly name: 'CodeChickenCore-1.1.13'
    // compileOnly name: 'neiaddons-1.12.15.41-mc1.7.10'
    // compileOnly name: 'NEIIntegration-MC1.7.10-1.1.2'
    // compileOnly name: 'NotEnoughItems-2.4.13-GTNH'
    // compileOnly name: 'CodeChickenLib-1.1.10'
    // compileOnly name: 'CraftTweaker-3.2.13'
    //  compileOnly name: 'MekanismClient-1.7.10-9.1.1.1031'
    // compileOnly name: 'Thaumcraft-1.7.10-4.2.3.5'

    //  compileOnly "com.github.ZhopaEnotaNaZabore:GregTech6-Unofficial:master-SNAPSHOT"
    compileOnly "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
    compileOnly "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
    compileOnly "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    //compileOnly 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
    // compileOnly "thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev"
}
dependencies {
    compile 'org.ow2.asm:asm-debug-all:5.0.3'

}

// Amun-Ra is a child Forge mod compiled inside the HTGT6 artifact.  The source
// set is deliberately separate so it has its own IDE module and dependencies,
// while its legacy mod id remains unchanged for existing worlds.
sourceSets {
    main {
        java {
            exclude 'de/katzenpapst/amunra/**'
            exclude 'dependencies/**'
        }
    }
    amunra {
        java.srcDir 'src/amunra/java'
        resources.srcDir 'src/amunra/resources'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    amunraOptionalApi {
        java.srcDir 'src/amunra-optional-api/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
}

configurations {
    amunraCompile.extendsFrom compile
}

// AmunRa's EnderIO integration is optional at runtime, but the development
// source needs the exact API versions used by the migration-test modpack.
// Keep one runtime copy in run/mods instead of duplicating these jars in libs.
dependencies {
    amunraCompile files('run/mods/EnderIO-2.9.27.jar')
    amunraCompile files('run/mods/endercore-0.4.8.jar')
}

compileAmunraJava {
    classpath += sourceSets.main.output
    classpath += sourceSets.amunraOptionalApi.output
    dependsOn compileAmunraOptionalApiJava
}

task verifyAmunRaMachineMetaSafety(type: JavaExec) {
    dependsOn amunraClasses
    classpath = sourceSets.amunra.runtimeClasspath
    main = 'de.katzenpapst.amunra.block.BlockMachineMetaSafetyFixture'
}
check.dependsOn verifyAmunRaMachineMetaSafety

jar {
    from sourceSets.amunra.output
    manifest {
        attributes (
                'FMLCorePlugin': 'com.mod.htgt6.asm.HTGT6LoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true'
        )
    }
}


