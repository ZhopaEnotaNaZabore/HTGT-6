buildscript {
    /* Репозитории Gradle-плагинов */
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }

        }
        dependencies {
            classpath('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
                changing = true
            }
        }

    }
    apply plugin: 'forge'
    apply plugin: 'idea'

dependencies {
  //  compile "curse.maven:notenoughbiomes:225013" // Example Maven coordinates
}
    targetCompatibility = sourceCompatibility = JavaVersion.VERSION_1_8

    archivesBaseName = "HiTech6_V_1.0.4_Build_"

/* Вспомогательные конфиги для IDEA */
    idea {
        module {
            inheritOutputDirs = true // Складываем *.class и assets в одну директорию, из разных Forge читать не будет
            excludeDirs += file('./run') // Исключаем директории из индексации
        }
    }

    minecraft {
        version = '1.7.10-10.13.4.1614-1.7.10' // Версия Forge
    }


    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "mcversion", project.minecraft.version

        from(sourceSets.main.resources.srcDirs) {
            include 'mcmod.info'
            expand 'version': project.version, 'mcversion': project.minecraft.version
        }

        from(sourceSets.main.resources.srcDirs) {
            exclude 'mcmod.info'
        }
    }

/* Dev версия мода без обфускации MC */
    task devJar(type: Jar) {
        classifier = 'dev'
        manifest = jar.manifest
        from sourceSets.main.output
    }

    artifacts {
        archives devJar
    }
dependencies{
    apiCompileOnly "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
    apiCompileOnly "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
    apiCompileOnly "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"

    repositories{
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        //// CodeChickenLib is in the Forge maven
        maven {
        	name = "chickenbones"
        	url = "http://chickenbones.net/maven/"
        }
    }
}
jar {
    manifest {
        attributes (
                // The path to your IFMLLoadingPlugin class
                'FMLCorePlugin': 'com.mod.htgt6.BiomeLoadingPlugin',

                // Tells Forge to also look for @Mod annotations in this jar
                'FMLCorePluginContainsFMLMod': 'true',

                // Required to ensure the DummyModContainer is recognized
                'ForceLoadAsMod': 'true',

                // Optional: prevents Forge from trying to search for mods inside your coremod twice
                'ModSide': 'CLIENT' // Or 'SERVER' or remove for both
        )
    }
}

