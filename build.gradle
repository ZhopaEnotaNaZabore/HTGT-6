buildscript {
    /* Репозитории Gradle-плагинов */
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        dependencies {
            classpath('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
                changing = true
            }
        }

    }
}


    apply plugin: 'forge'
    apply plugin: 'idea'

    targetCompatibility = sourceCompatibility = JavaVersion.VERSION_1_8

    archivesBaseName = "HiTech6_V_1.0.4_Build_"

/* Вспомогательные конфиги для IDEA */
    idea {
        module {
            inheritOutputDirs = true // Складываем *.class и assets в одну директорию, из разных Forge читать не будет
            excludeDirs += file('./run') // Исключаем директории из индексации
        }
    }

    minecraft {
        version = '1.7.10-10.13.4.1614-1.7.10' // Версия Forge
        //clientJvmArgs += ["-Dfml.coreMods.load=com.gtnewhorizon.gtnhmixins.IEarlyMixinLoader"]
       // serverJvmArgs += ["-Dfml.coreMods.load=com.gtnewhorizon.gtnhmixins.IEarlyMixinLoader"]
    }


    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    processResources {
        inputs.property "version", project.version
        inputs.property "mcversion", project.minecraft.version

        from(sourceSets.main.resources.srcDirs) {
            include 'mcmod.info'
            expand 'version': project.version, 'mcversion': project.minecraft.version
        }

        from(sourceSets.main.resources.srcDirs) {
            exclude 'mcmod.info'
        }
    }

/* Dev версия мода без обфускации MC */
    task devJar(type: Jar) {
        classifier = 'dev'
        manifest = jar.manifest
        from sourceSets.main.output
    }

    artifacts {
        archives devJar
    }

    repositories {
        flatDir {dirs "libs"}
        mavenCentral()
       maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        //// CodeChickenLib is in the Forge maven
        maven {
            name = "chickenbones"
            url = "http://chickenbones.net/maven/"
        }
    }
dependencies {


    compileOnly name: 'gregtech_1.7.10-6.15.07-unofficial'
    compileOnly name: 'GalaxySpace-1.7.10-1.2.15'
    compileOnly name: 'GalacticraftCore-1.7-3.0.12.504-dev'
    compileOnly name: 'Galacticraft-Planets-1.7-3.0.12.504-dev'
    compileOnly name: 'MicdoodleCore-1.7-3.0.12.504-dev'
  //  compileOnly name: '+unimixins-all-1.7.10-0.1.23'
    compileOnly name: 'CraftTweaker-3'


  //  compileOnly name: 'CodeChickenCore-1.1.13'
   // compileOnly name: 'neiaddons-1.12.15.41-mc1.7.10'
   // compileOnly name: 'NEIIntegration-MC1.7.10-1.1.2'
   // compileOnly name: 'NotEnoughItems-2.4.13-GTNH'
   // compileOnly name: 'CodeChickenLib-1.1.10'
   // compileOnly name: 'CraftTweaker-3.2.13'
  //  compileOnly name: 'MekanismClient-1.7.10-9.1.1.1031'
   // compileOnly name: 'Thaumcraft-1.7.10-4.2.3.5'

    //  compileOnly "com.github.ZhopaEnotaNaZabore:GregTech6-Unofficial:master-SNAPSHOT"
    compileOnly "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
    compileOnly "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
    compileOnly "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"
    //compileOnly 'org.spongepowered:mixin:0.7.11-SNAPSHOT'
   // compileOnly "thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev"
}
dependencies {
    compile 'org.ow2.asm:asm-debug-all:5.0.3'

}
jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'com.mod.htgt6.asm.HTGT6LoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true'

        )
    }

    afterEvaluate {

        tasks.withType(JavaExec) {

            if (project.hasProperty("minecraft.clientArgs")) {

                args project.property("minecraft.clientArgs").split(" ")
            }

            if (project.hasProperty("minecraft.jvmArgs")) {

                jvmArgs project.property("minecraft.jvmArgs").split(" ")
            }
        }
    }

}